      - food-delivery-infra
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  customer-service:
    build:
      context: .
    dockerfile: Dockerfile
    args:
      SERVICE_NAME:packages/customer-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      CUSTOMER_PORT: 3006
      CUSTOMER_DATABASE_URL: postgres://postgres:postgres@postgres-customer:5436/customers
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
