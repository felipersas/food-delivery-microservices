# Application Services - Production Environment
# Sem portas expostas para debug, restart policies, health checks

include:
  - docker-compose.infra.yml
  - docker-compose.db.yml

networks:
  food-delivery-app:
    driver: bridge

services:
  api-gateway:
    build:
      context: .
    dockerfile: Dockerfile
    args:
      SERVICE_NAME:packages/api-gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3000
      ORDER_SERVICE_URL: http://order-service:3001
      KITCHEN_SERVICE_URL: http://kitchen-service:3002
      PAYMENT_SERVICE_URL: http://payment-service:3003
      NOTIFICATION_SERVICE_URL: http://notification-service:3004
      ANALYTICS_SERVICE_URL: http://analytics-service:3005
      CUSTOMER_SERVICE_URL: http://customer-service:3006
      RESTAURANT_SERVICE_URL: http://restaurant-service:3007
      AUTH_SERVICE_URL: http://auth-service:3008
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - food-delivery-app
      - food-delivery-infra
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  order-service:
    build:
      context: .
    dockerfile: Dockerfile
    args:
      SERVICE_NAME:packages/order-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      ORDER_PORT: 3001
      ORDER_DATABASE_URL: postgres://postgres:postgres@postgres-order:5432/orders
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_EXCHANGE: food-ordering
    depends_on:
      postgres-order:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - food-delivery-app
      - food-delivery-db
      - food-delivery-infra
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  kitchen-service:
    build:
      context: .
    dockerfile: Dockerfile
    args:
      SERVICE_NAME:packages/kitchen-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      KITCHEN_PORT: 3002
      KITCHEN_DATABASE_URL: postgres://postgres:postgres@postgres-kitchen:5434/kitchen
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_EXCHANGE: food-ordering
    depends_on:
      postgres-kitchen:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - food-delivery-app
      - food-delivery-db
      - food-delivery-infra
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  payment-service:
    build:
      context: .
    dockerfile: Dockerfile
    args:
      SERVICE_NAME:packages/payment-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PAYMENT_PORT: 3003
      PAYMENT_DATABASE_URL: postgres://postgres:postgres@postgres-payment:5433/payments
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_EXCHANGE: food-ordering
    depends_on:
      postgres-payment:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - food-delivery-app
      - food-delivery-db
      - food-delivery-infra
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  notification-service:
