  auth-service:
    build:
      context: .
    dockerfile: Dockerfile
    args:
      SERVICE_NAME:packages/auth-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      AUTH_PORT: 3008
      AUTH_DATABASE_URL: postgres://postgres:postgres@postgres-auth:5438/auth
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_EXCHANGE: food-ordering
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 7d
    depends_on:
      postgres-auth:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
