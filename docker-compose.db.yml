# Database Services - All Environments
# Bancos de dados isolados em rede interna (sem exposição externa)

networks:
  food-delivery-db:
    driver: bridge
    internal: true  # Isolado - sem acesso externo

services:
  postgres-order:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orders
    volumes:
      - pgdata_order:/var/lib/postgresql/data
    networks:
      - food-delivery-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 10s
      retries: 5

  postgres-payment:
