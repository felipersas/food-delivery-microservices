# Test Environment Override
# Exposes database ports to host for integration tests
# Usage: docker compose -f docker-compose.infra.yml -f docker-compose.db.yml -f docker-compose.test.yml up

networks:
  food-delivery-db:
    internal: false  # Override internal: true to allow host access

services:
  # Expose PostgreSQL ports to host
  postgres-order:
    ports:
      - "5432:5432"

  postgres-payment:
    ports:
      - "5433:5432"

  postgres-kitchen:
    ports:
      - "5434:5432"

  postgres-customer:
    ports:
      - "5436:5432"

  postgres-restaurant:
    ports:
      - "5437:5432"

  postgres-auth:
    ports:
      - "5438:5432"

  postgres-cart:
    ports:
      - "5439:5432"

  # Expose RabbitMQ ports to host
  rabbitmq:
    ports:
      - "5672:5672"
      - "15672:15672"  # Management UI
