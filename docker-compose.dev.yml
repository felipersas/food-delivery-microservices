# Application Services - Development Environment
# Override para desenvolvimento com portas expostas para debug

include:
  - docker-compose.infra.yml
  - docker-compose.db.yml

networks:
  food-delivery-app:
    driver: bridge

services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: api-gateway
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      API_PORT: 3000
      ORDER_SERVICE_URL: http://order-service:3001
      KITCHEN_SERVICE_URL: http://kitchen-service:3002
      PAYMENT_SERVICE_URL: http://payment-service:3003
      NOTIFICATION_SERVICE_URL: http://notification-service:3004
      ANALYTICS_SERVICE_URL: http://analytics-service:3005
      CUSTOMER_SERVICE_URL: http://customer-service:3006
      RESTAURANT_SERVICE_URL: http://restaurant-service:3007
      AUTH_SERVICE_URL: http://auth-service:3008
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - food-delivery-app
      - food-delivery-infra
    extra_hosts:
      - "host.docker.internal:host-gateway"

  order-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: order-service
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      ORDER_PORT: 3001
      ORDER_DATABASE_URL: postgres://postgres:postgres@postgres-order:5432/orders
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_EXCHANGE: food-ordering
    depends_on:
      postgres-order:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - food-delivery-app
      - food-delivery-db
      - food-delivery-infra
    extra_hosts:
      - "host.docker.internal:host-gateway"

  kitchen-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: kitchen-service
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: development
      KITCHEN_PORT: 3002
      KITCHEN_DATABASE_URL: postgres://postgres:postgres@postgres-kitchen:5434/kitchen
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_EXCHANGE: food-ordering
    depends_on:
      postgres-kitchen:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - food-delivery-app
      - food-delivery-db
      - food-delivery-infra
    extra_hosts:
      - "host.docker.internal:host-gateway"

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: payment-service
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: development
      PAYMENT_PORT: 3003
      PAYMENT_DATABASE_URL: postgres://postgres:postgres@postgres-payment:5433/payments
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_EXCHANGE: food-ordering
    depends_on:
      postgres-payment:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - food-delivery-app
      - food-delivery-db
      - food-delivery-infra
    extra_hosts:
      - "host.docker.internal:host-gateway"

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: notification-service
    ports:
      - "3004:3004"
    environment:
      NODE_ENV: development
      NOTIFICATION_PORT: 3004
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_EXCHANGE: food-ordering
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - food-delivery-app
      - food-delivery-infra
    extra_hosts:
      - "host.docker.internal:host-gateway"

  analytics-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: analytics-service
    ports:
      - "3005:3005"
    environment:
      NODE_ENV: development
      ANALYTICS_PORT: 3005
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_EXCHANGE: food-ordering
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - food-delivery-app
      - food-delivery-infra
    extra_hosts:
      - "host.docker.internal:host-gateway"

  customer-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: customer-service
    ports:
      - "3006:3006"
    environment:
      NODE_ENV: development
      CUSTOMER_PORT: 3006
      CUSTOMER_DATABASE_URL: postgres://postgres:postgres@postgres-customer:5436/customers
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_EXCHANGE: food-ordering
    depends_on:
      postgres-customer:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - food-delivery-app
      - food-delivery-db
      - food-delivery-infra
    extra_hosts:
      - "host.docker.internal:host-gateway"

  restaurant-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: restaurant-service
    ports:
      - "3007:3007"
    environment:
      NODE_ENV: development
      RESTAURANT_PORT: 3007
      RESTAURANT_DATABASE_URL: postgres://postgres:postgres@postgres-restaurant:5437/restaurants
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_EXCHANGE: food-ordering
    depends_on:
      postgres-restaurant:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - food-delivery-app
      - food-delivery-db
      - food-delivery-infra
    extra_hosts:
      - "host.docker.internal:host-gateway"

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: auth-service
    ports:
      - "3008:3008"
    environment:
      NODE_ENV: development
      AUTH_PORT: 3008
      AUTH_DATABASE_URL: postgres://postgres:postgres@postgres-auth:5438/auth
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_EXCHANGE: food-ordering
      JWT_SECRET: dev-secret-change-in-production
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 7d
    depends_on:
      postgres-auth:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - food-delivery-app
      - food-delivery-db
      - food-delivery-infra
    extra_hosts:
      - "host.docker.internal:host-gateway"
